# RALP Database v2 — self-hosted stack.
#
# Phase 0 brings up PostgreSQL only; the `web` service (Next.js app + API) is
# added in a later phase. This same file runs unchanged on a laptop, an on-prem
# server, or a cloud VM (e.g. an AWS EC2 instance) — the app depends on nothing
# outside what is defined here.
#
#   docker compose --env-file .env up -d      # start
#   DATABASE_URL=... node ../scripts/migrate.mjs   # apply migrations
#
# Data lives in the named volume `ralp_pgdata` on the host — it is never sent
# anywhere. Back it up with pg_dump.

services:
  postgres:
    image: postgres:16-alpine
    container_name: ralp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ralp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ralp_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-ralp}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ralp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ralp} -d ${POSTGRES_DB:-ralp}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ralp_pgdata:
