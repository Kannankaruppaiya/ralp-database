name: CI

on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ralp
          POSTGRES_PASSWORD: ralp
          POSTGRES_DB: ralp
        ports:
          - '5432:5432'
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5

    env:
      DATABASE_URL: postgres://ralp:ralp@localhost:5432/ralp
      TEST_DATABASE_URL: postgres://ralp:ralp@localhost:5432/ralp
      JWT_SECRET: ci-test-secret

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high --omit=dev
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm run test
