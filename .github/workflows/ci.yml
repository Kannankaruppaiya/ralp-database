name: CI

# Gate every change to a tracked branch on the same checks a contributor runs
# locally: types, lint, and a full production build. No secrets are needed —
# the build defaults to the development tier, which warns (rather than throws)
# on absent Supabase env vars, so it compiles without touching any project.

on:
  push:
    branches: [main, staging, dev]
  pull_request:
    branches: [main, staging, dev]

# A newer push to the same ref cancels the in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
